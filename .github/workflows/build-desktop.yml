name: Build Windows Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Tauri App (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cyber Tetris ${{ github.ref_name }}'
          releaseBody: 'Desktop application setup files for Cyber Tetris (Windows)'
          releaseDraft: true
          prerelease: false

      - name: Upload Windows Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cyber-tetris-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/cyber_tetris.exe
            src-tauri/target/release/Cyber Tetris.exe
          if-no-files-found: warn
          retention-days: 1

