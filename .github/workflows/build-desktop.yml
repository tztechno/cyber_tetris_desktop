name: Build Desktop Apps (Mac & Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macOS'
            artifact_name: 'cyber-tetris-macos'
          - platform: 'windows-latest'
            os_name: 'Windows'
            artifact_name: 'cyber-tetris-windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci || npm install

      - name: Build Tauri App (${{ matrix.os_name }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Cyber Tetris ${{ github.ref_name }}'
          releaseBody: 'Desktop application setup files for Cyber Tetris (${{ matrix.os_name }})'
          releaseDraft: true
          prerelease: false

      # Upload Mac artifacts
      - name: Upload macOS Build Artifacts
        if: matrix.platform == 'macos-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn

      # Upload Windows artifacts
      - name: Upload Windows Build Artifacts
        if: matrix.platform == 'windows-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/cyber_tetris.exe
            src-tauri/target/release/Cyber Tetris.exe
          if-no-files-found: warn
